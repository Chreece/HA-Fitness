<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">How Fitness connects data sources to Home Assistant features</title>
  <desc id="desc">Live sensors, workout providers, and sleep providers flow through normalization, reconciliation, validation, and personal history into dashboards, automations, feedback, and optional explanations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071d2b"/>
      <stop offset="1" stop-color="#10354a"/>
    </linearGradient>
    <linearGradient id="fitness" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#40bdf5"/>
      <stop offset="1" stop-color="#27d2a2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001018" flood-opacity=".42"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#72d7ff"/>
    </marker>
  </defs>
  <rect width="1200" height="560" rx="30" fill="url(#bg)"/>
  <text x="600" y="54" fill="#fff" font-family="system-ui,sans-serif" font-size="28" font-weight="700" text-anchor="middle">One person, several sources, one reliable Fitness model</text>
  <g font-family="system-ui,sans-serif" filter="url(#shadow)">
    <g transform="translate(46 105)">
      <rect width="255" height="92" rx="20" fill="#173f55" stroke="#4fc7f4"/>
      <circle cx="42" cy="46" r="23" fill="#40bdf5" fill-opacity=".18"/>
      <path d="M35 46h14M42 39v14" stroke="#6fdcff" stroke-width="5" stroke-linecap="round"/>
      <text x="78" y="39" fill="#fff" font-size="18" font-weight="700">Live sensors</text>
      <text x="78" y="65" fill="#b9d9e8" font-size="14">BLE · ANT+ · remote gateway</text>
    </g>
    <g transform="translate(46 234)">
      <rect width="255" height="92" rx="20" fill="#173f55" stroke="#4fc7f4"/>
      <circle cx="42" cy="46" r="23" fill="#40bdf5" fill-opacity=".18"/>
      <path d="M29 51l10-14 8 10 8-12" fill="none" stroke="#6fdcff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="78" y="39" fill="#fff" font-size="18" font-weight="700">Workout sources</text>
      <text x="78" y="65" fill="#b9d9e8" font-size="14">Watch · app · equipment</text>
    </g>
    <g transform="translate(46 363)">
      <rect width="255" height="92" rx="20" fill="#173f55" stroke="#4fc7f4"/>
      <circle cx="42" cy="46" r="23" fill="#40bdf5" fill-opacity=".18"/>
      <path d="M51 35a17 17 0 1 0 0 22 14 14 0 1 1 0-22Z" fill="#6fdcff"/>
      <text x="78" y="39" fill="#fff" font-size="18" font-weight="700">Sleep sources</text>
      <text x="78" y="65" fill="#b9d9e8" font-size="14">Sleep · stages · HRV · score</text>
    </g>
    <path d="M315 151H390M315 280H390M315 409H390" stroke="#72d7ff" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(410 122)">
      <rect width="370" height="316" rx="28" fill="url(#fitness)"/>
      <rect x="12" y="12" width="346" height="292" rx="21" fill="#08283a" fill-opacity=".88"/>
      <text x="185" y="63" fill="#fff" font-size="30" font-weight="800" text-anchor="middle">Fitness</text>
      <g fill="#d9f5ff" font-size="17">
        <text x="54" y="116">1. Normalize compatible values</text>
        <text x="54" y="164">2. Merge the same workout or night</text>
        <text x="54" y="212">3. Validate evidence and timestamps</text>
        <text x="54" y="260">4. Build per-person history</text>
      </g>
    </g>
    <path d="M795 280H870" stroke="#72d7ff" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(890 105)">
      <rect width="264" height="350" rx="24" fill="#173f55" stroke="#62dcb7"/>
      <text x="132" y="47" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">Useful in Home Assistant</text>
      <g fill="#d9f5ff" font-size="16">
        <text x="36" y="99">• User dashboards</text>
        <text x="36" y="143">• Fitness TV and Cast</text>
        <text x="36" y="187">• Automations</text>
        <text x="36" y="231">• Lights, TTS, notifications</text>
        <text x="36" y="275">• Transparent evaluations</text>
        <text x="36" y="319">• Optional AI explanations</text>
      </g>
    </g>
  </g>
  <text x="600" y="518" fill="#a9cfdf" font-family="system-ui,sans-serif" font-size="15" text-anchor="middle">Sources remain authoritative. Fitness leaves unsupported or insufficient data unavailable.</text>
</svg>
